<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Local Recipe Vault</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f7f9fb;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #e0e7ff;
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #818cf8;
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #6366f1;
        }
        .btn-primary {
            transition: all 0.2s ease-in-out;
        }
        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(99, 102, 241, 0.4);
        }
        .modal-enter {
            opacity: 1;
            transition: opacity 0.3s ease-out;
        }
        .modal-leave {
            opacity: 0;
            transition: opacity 0.3s ease-in;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Header & Navigation -->
    <header class="bg-white shadow-md sticky top-0 z-20">
        <div class="max-w-7xl mx-auto flex justify-between items-center p-4">
            <h1 class="text-3xl font-bold text-indigo-600 tracking-tight">The Local Recipe Vault</h1>
            
            <button id="add-recipe-btn" class="bg-indigo-500 text-white px-4 py-2 rounded-lg text-sm font-semibold hover:bg-indigo-600 transition duration-150 shadow-md">
                Add New Recipe
            </button>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-grow max-w-7xl mx-auto w-full p-4">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 h-full">

            <!-- Recipe List Sidebar (Left) -->
            <div class="lg:col-span-1 bg-white p-6 rounded-xl shadow-lg h-full max-h-[calc(100vh-140px)] flex flex-col">
                <h2 class="text-2xl font-semibold text-gray-800 mb-4 border-b pb-2">My Recipes</h2>
                
                <!-- Search Bar -->
                <div class="mb-4">
                    <input type="text" id="search-input" placeholder="Search my recipes..."
                           class="w-full p-3 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500 transition duration-150">
                </div>

                <!-- List Container -->
                <div id="recipe-list" class="space-y-3 flex-grow custom-scrollbar overflow-y-auto pr-2">
                    <p class="text-gray-500 text-center py-4">Loading recipes...</p>
                </div>
                <p id="list-footer" class="text-sm text-gray-500 mt-4 text-center">Data is saved only in your browser.</p>
            </div>

            <!-- Recipe Detail Viewer (Right) -->
            <div class="lg:col-span-2 bg-white p-6 rounded-xl shadow-lg">
                <div id="recipe-detail-container" class="space-y-6">
                    <!-- Default message -->
                    <div class="text-center py-20 text-gray-500">
                        <svg xmlns="http://www.w3.org/2000/svg" class="mx-auto h-12 w-12 text-indigo-400" viewBox="0 0 20 20" fill="currentColor">
                            <path d="M5 4a2 2 0 012-2h6a2 2 0 012 2v14l-5-2.5L5 18V4z" />
                        </svg>
                        <h3 class="mt-2 text-lg font-medium">Select or Create a Recipe</h3>
                        <p class="mt-1 text-sm">Your recipes are securely saved in your browser's local storage.</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Add/Edit Recipe Modal -->
    <div id="recipe-modal" class="modal-enter hidden fixed inset-0 bg-gray-900 bg-opacity-75 z-50 flex items-center justify-center p-4" onclick="closeModal(event)">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-lg p-6 max-h-[90vh] overflow-y-auto" onclick="event.stopPropagation()">
            <h3 id="modal-title" class="text-2xl font-bold text-gray-800 mb-6 border-b pb-3">Add New Recipe</h3>
            <form id="recipe-form" class="space-y-4">
                
                <!-- Hidden ID field for editing -->
                <input type="hidden" id="recipe-id">

                <!-- Recipe Name -->
                <div>
                    <label for="recipe-name" class="block text-sm font-medium text-gray-700">Recipe Name</label>
                    <input type="text" id="recipe-name" required
                           class="mt-1 block w-full p-3 border border-gray-300 rounded-lg shadow-sm focus:ring-indigo-500 focus:border-indigo-500">
                </div>

                <!-- Prep Time -->
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label for="prep-time" class="block text-sm font-medium text-gray-700">Prep Time (mins)</label>
                        <input type="number" id="prep-time" required min="1"
                               class="mt-1 block w-full p-3 border border-gray-300 rounded-lg shadow-sm focus:ring-indigo-500 focus:border-indigo-500">
                    </div>
                    <!-- Cook Time -->
                    <div>
                        <label for="cook-time" class="block text-sm font-medium text-gray-700">Cook Time (mins)</label>
                        <input type="number" id="cook-time" required min="0"
                               class="mt-1 block w-full p-3 border border-gray-300 rounded-lg shadow-sm focus:ring-indigo-500 focus:border-indigo-500">
                    </div>
                </div>

                <!-- Ingredients (Textarea) -->
                <div>
                    <label for="ingredients" class="block text-sm font-medium text-gray-700">Ingredients (List each item on a new line)</label>
                    <textarea id="ingredients" rows="4" required
                              class="mt-1 block w-full p-3 border border-gray-300 rounded-lg shadow-sm focus:ring-indigo-500 focus:border-indigo-500"></textarea>
                </div>

                <!-- Instructions (Textarea) -->
                <div>
                    <label for="instructions" class="block text-sm font-medium text-gray-700">Instructions (List each step on a new line)</label>
                    <textarea id="instructions" rows="6" required
                              class="mt-1 block w-full p-3 border border-gray-300 rounded-lg shadow-sm focus:ring-indigo-500 focus:border-indigo-500"></textarea>
                </div>
                
                <!-- Share Toggle (Removed for local storage version) -->

                <div class="flex justify-end space-x-3 pt-4">
                    <button type="button" onclick="hideModal()" class="px-4 py-2 bg-gray-200 text-gray-700 rounded-lg font-medium hover:bg-gray-300 transition duration-150">
                        Cancel
                    </button>
                    <button type="submit" id="save-recipe-btn" class="btn-primary px-4 py-2 bg-indigo-500 text-white rounded-lg font-semibold shadow-md">
                        Save Recipe
                    </button>
                </div>
            </form>
        </div>
    </div>
    
    <!-- Confirmation Modal -->
    <div id="confirmation-modal" class="modal-enter hidden fixed inset-0 bg-gray-900 bg-opacity-75 z-50 flex items-center justify-center p-4" onclick="closeConfirmationModal(event)">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-sm p-6" onclick="event.stopPropagation()">
            <h3 id="confirm-title" class="text-xl font-bold text-gray-800 mb-4">Confirm Action</h3>
            <p id="confirm-message" class="text-gray-700 mb-6">Are you sure you want to perform this action?</p>
            <div class="flex justify-end space-x-3">
                <button id="confirm-cancel" class="px-4 py-2 bg-gray-200 text-gray-700 rounded-lg font-medium hover:bg-gray-300 transition duration-150">
                    Cancel
                </button>
                <button id="confirm-ok" class="px-4 py-2 bg-red-500 text-white rounded-lg font-semibold shadow-md hover:bg-red-600 transition duration-150">
                    Confirm
                </button>
            </div>
        </div>
    </div>

    <!-- Toast/Notification Container -->
    <div id="toast-container" class="fixed bottom-4 right-4 space-y-2 z-50">
        <!-- Notifications will appear here -->
    </div>

    <script>
        // --- Global State ---
        const STORAGE_KEY = 'localRecipeVault';
        let allRecipes = [];
        let currentRecipeId = null;
        let confirmationResolver = null; // Promise resolver for custom modal

        // --- Utility Functions ---

        function showToast(message, type = 'success') {
            const toastContainer = document.getElementById('toast-container');
            const colorMap = { 'success': 'green', 'error': 'red', 'warning': 'yellow' };
            const color = colorMap[type] || 'green';
            
            const toast = document.createElement('div');
            toast.className = `p-4 rounded-lg shadow-xl bg-${color}-500 text-white font-medium transition-all duration-300 transform translate-x-0 opacity-100`;
            toast.innerHTML = `<p>${message}</p>`;

            toastContainer.appendChild(toast);
            
            setTimeout(() => {
                toast.classList.add('opacity-0');
                toast.addEventListener('transitionend', () => toast.remove());
            }, 3000);
        }

        // --- Local Storage Functions ---

        function loadRecipes() {
            try {
                const recipesJson = localStorage.getItem(STORAGE_KEY);
                allRecipes = recipesJson ? JSON.parse(recipesJson) : [];
                return allRecipes;
            } catch (e) {
                console.error("Error loading recipes from local storage:", e);
                showToast("Failed to load recipes. Local storage may be full or restricted.", "error");
                return [];
            }
        }

        function saveRecipes() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(allRecipes));
            } catch (e) {
                console.error("Error saving recipes to local storage:", e);
                showToast("Failed to save recipes. Local storage may be full or restricted.", "error");
            }
        }
        
        // --- Recipe Lifecycle Functions ---

        function getUniqueId() {
            // Simple unique ID generation
            return Date.now().toString(36) + Math.random().toString(36).substring(2);
        }
        
        function saveRecipe(recipeData, recipeId = null) {
            if (recipeId) {
                // Editing existing recipe
                const index = allRecipes.findIndex(r => r.id === recipeId);
                if (index !== -1) {
                    allRecipes[index] = { id: recipeId, ...recipeData };
                    showToast(`Recipe "${recipeData.name}" updated!`, 'success');
                }
            } else {
                // Adding new recipe
                const newRecipe = { id: getUniqueId(), ...recipeData };
                allRecipes.push(newRecipe);
                currentRecipeId = newRecipe.id;
                showToast(`New recipe "${recipeData.name}" created!`, 'success');
            }

            saveRecipes();
            renderRecipeList(allRecipes);
            // After saving, select the recipe to show details
            selectRecipe(currentRecipeId || recipeId, recipeData.name, true); 
        }

        function deleteRecipe(recipeId, recipeName) {
            allRecipes = allRecipes.filter(r => r.id !== recipeId);
            saveRecipes();
            
            showToast(`Recipe "${recipeName}" deleted!`, 'success');
            
            // If the deleted recipe was the selected one, clear the detail view
            if (currentRecipeId === recipeId) {
                currentRecipeId = null;
                renderRecipeDetail(null);
            }
            
            renderRecipeList(allRecipes);
        }

        // --- UI Rendering Functions ---

        function formatTextToList(text, ordered = false) {
            if (!text) return '<p class="text-gray-500">None provided.</p>';
            const lines = text.split('\n').filter(line => line.trim() !== '');
            if (ordered) {
                return lines.map((line, index) => `<li class="mb-3 pl-2 font-medium text-gray-700">${index + 1}. ${line.trim()}</li>`).join('');
            } else {
                return lines.map(line => `<li class="list-disc ml-6">${line.trim()}</li>`).join('');
            }
        }

        function renderRecipeList(recipes) {
            const listContainer = document.getElementById('recipe-list');
            listContainer.innerHTML = ''; 

            if (recipes.length === 0) {
                listContainer.innerHTML = '<p class="text-gray-500 text-center py-4">No recipes found. Click "Add New Recipe" to start.</p>';
                document.getElementById('list-footer').textContent = "Data is saved only in your browser.";
                return;
            }
            
            // Apply search filter
            const searchTerm = document.getElementById('search-input').value.toLowerCase();
            const filteredRecipes = recipes.filter(r => r.name.toLowerCase().includes(searchTerm) || r.ingredients.toLowerCase().includes(searchTerm));

            if (filteredRecipes.length === 0) {
                 listContainer.innerHTML = '<p class="text-gray-500 text-center py-4">No recipes match your search.</p>';
            }

            filteredRecipes.forEach(recipe => {
                const isActive = recipe.id === currentRecipeId;
                const escapedName = recipe.name.replace(/'/g, "\\'");
                
                const recipeItem = `
                    <button id="recipe-item-${recipe.id}"
                        onclick="selectRecipe('${recipe.id}', '${escapedName}', true)"
                        class="w-full text-left p-3 rounded-lg transition duration-150 ease-in-out 
                               ${isActive ? 'bg-indigo-100 text-indigo-700 shadow-inner' : 'bg-gray-50 hover:bg-indigo-50 hover:text-indigo-600'}">
                        <span class="font-semibold truncate block">${recipe.name}</span>
                        <span class="text-xs ${isActive ? 'text-indigo-500' : 'text-gray-400'}">${recipe.prepTime}m Prep / ${recipe.cookTime}m Cook</span>
                    </button>
                `;
                listContainer.innerHTML += recipeItem;
            });
            document.getElementById('list-footer').textContent = `Total recipes: ${recipes.length}. Saved in your browser's local storage.`;
        }

        function renderRecipeDetail(recipe) {
            const detailContainer = document.getElementById('recipe-detail-container');
            
            if (!recipe) {
                detailContainer.innerHTML = `
                    <div class="text-center py-20 text-gray-500">
                        <svg xmlns="http://www.w3.org/2000/svg" class="mx-auto h-12 w-12 text-indigo-400" viewBox="0 0 20 20" fill="currentColor">
                            <path d="M5 4a2 2 0 012-2h6a2 2 0 012 2v14l-5-2.5L5 18V4z" />
                        </svg>
                        <h3 class="mt-2 text-lg font-medium">Select or Create a Recipe</h3>
                        <p class="mt-1 text-sm">Your recipes are securely saved in your browser's local storage.</p>
                    </div>
                `;
                return;
            }

            const totalTime = parseInt(recipe.prepTime || 0) + parseInt(recipe.cookTime || 0);
            const escapedName = recipe.name.replace(/'/g, "\\'");

            detailContainer.innerHTML = `
                <div class="space-y-6">
                    <div class="flex justify-between items-start border-b pb-4">
                        <div>
                            <h2 class="text-4xl font-bold text-gray-800">${recipe.name}</h2>
                            <p class="text-sm text-indigo-600 font-medium mt-1">Total Time: <span class="text-gray-600">${totalTime} minutes</span></p>
                        </div>
                        <div class="flex space-x-2">
                            <button onclick="editRecipe('${recipe.id}')" 
                                class="p-2 bg-yellow-100 text-yellow-600 rounded-full hover:bg-yellow-200 transition duration-150" 
                                title="Edit Recipe">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                                    <path d="M17.414 2.586a2 2 0 00-2.828 0L7 10.172V13h2.828l7.586-7.586a2 2 0 000-2.828z" />
                                    <path fill-rule="evenodd" d="M2 6a2 2 0 012-2h4a1 1 0 010 2H4v10h10v-4a1 1 0 112 0v4a2 2 0 01-2 2H4a2 2 0 01-2-2V6z" clip-rule="evenodd" />
                                </svg>
                            </button>
                            <button onclick="openDeleteConfirmation('${recipe.id}', '${escapedName}')" 
                                class="p-2 bg-red-100 text-red-600 rounded-full hover:bg-red-200 transition duration-150" 
                                title="Delete Recipe">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                                    <path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm4 0a1 1 0 10-2 0v6a1 1 0 102 0V8z" clip-rule="evenodd" />
                                </svg>
                            </button>
                        </div>
                    </div>

                    <!-- Prep and Cook Time Cards -->
                    <div class="grid grid-cols-2 gap-4 text-center">
                        <div class="bg-indigo-50 p-4 rounded-lg shadow-inner">
                            <p class="text-xl font-bold text-indigo-700">${recipe.prepTime} min</p>
                            <p class="text-sm text-indigo-500">Prep Time</p>
                        </div>
                        <div class="bg-indigo-50 p-4 rounded-lg shadow-inner">
                            <p class="text-xl font-bold text-indigo-700">${recipe.cookTime} min</p>
                            <p class="text-sm text-indigo-500">Cook Time</p>
                        </div>
                    </div>

                    <!-- Ingredients Section -->
                    <div class="bg-gray-50 p-5 rounded-xl shadow">
                        <h3 class="text-2xl font-semibold text-gray-700 mb-3 border-b pb-2">Ingredients</h3>
                        <ul class="text-gray-600 list-none space-y-1">
                            ${formatTextToList(recipe.ingredients)}
                        </ul>
                    </div>

                    <!-- Instructions Section -->
                    <div class="bg-gray-50 p-5 rounded-xl shadow">
                        <h3 class="text-2xl font-semibold text-gray-700 mb-3 border-b pb-2">Instructions</h3>
                        <ol class="text-gray-600 list-none space-y-2">
                            ${formatTextToList(recipe.instructions, true)}
                        </ol>
                    </div>
                </div>
            `;
        }

        function selectRecipe(recipeId, recipeName, updateList = true) {
            currentRecipeId = recipeId;
            const recipe = allRecipes.find(r => r.id === recipeId);

            if (recipe) {
                renderRecipeDetail(recipe);
            } else {
                renderRecipeDetail(null);
                currentRecipeId = null; 
            }

            if (updateList) {
                // Update active styling
                document.querySelectorAll('#recipe-list button').forEach(btn => {
                    btn.classList.remove('bg-indigo-100', 'text-indigo-700', 'shadow-inner');
                    btn.classList.add('bg-gray-50', 'hover:bg-indigo-50', 'hover:text-indigo-600');
                    const span = btn.querySelector('span:last-child');
                    if (span) {
                        span.classList.remove('text-indigo-500');
                        span.classList.add('text-gray-400');
                    }
                });

                const currentButton = document.getElementById(`recipe-item-${recipeId}`);
                if (currentButton) {
                    currentButton.classList.add('bg-indigo-100', 'text-indigo-700', 'shadow-inner');
                    currentButton.classList.remove('bg-gray-50', 'hover:bg-indigo-50', 'hover:text-indigo-600');
                    const span = currentButton.querySelector('span:last-child');
                    if (span) {
                        span.classList.add('text-indigo-500');
                        span.classList.remove('text-gray-400');
                    }
                }
            }
        }
        
        // --- Modal Functions ---

        function showModal(recipe = null) {
            const modal = document.getElementById('recipe-modal');
            const form = document.getElementById('recipe-form');
            const modalTitle = document.getElementById('modal-title');
            
            form.reset();

            if (recipe) {
                modalTitle.textContent = `Edit Recipe: ${recipe.name}`;
                document.getElementById('recipe-id').value = recipe.id;
                document.getElementById('recipe-name').value = recipe.name;
                document.getElementById('prep-time').value = recipe.prepTime;
                document.getElementById('cook-time').value = recipe.cookTime;
                document.getElementById('ingredients').value = recipe.ingredients;
                document.getElementById('instructions').value = recipe.instructions;
            } else {
                modalTitle.textContent = "Add New Recipe";
                document.getElementById('recipe-id').value = '';
            }
            
            modal.classList.remove('hidden', 'modal-leave');
            modal.classList.add('modal-enter');
        }

        function hideModal() {
            const modal = document.getElementById('recipe-modal');
            modal.classList.remove('modal-enter');
            modal.classList.add('modal-leave');
            
            setTimeout(() => {
                modal.classList.add('hidden');
                modal.classList.remove('modal-leave');
            }, 300);
        }

        function closeModal(event) {
            if (event.target.id === 'recipe-modal') {
                hideModal();
            }
        }

        function editRecipe(recipeId) {
            const recipeToEdit = allRecipes.find(r => r.id === recipeId);
            if (recipeToEdit) {
                showModal(recipeToEdit);
            } else {
                showToast("Recipe data not found for editing.", "error");
            }
        }
        
        // --- Custom Confirmation Modal Logic ---
        function showConfirmationModal(title, message) {
            const modal = document.getElementById('confirmation-modal');
            document.getElementById('confirm-title').textContent = title;
            document.getElementById('confirm-message').textContent = message;
            
            modal.classList.remove('hidden', 'modal-leave');
            modal.classList.add('modal-enter');

            return new Promise((resolve) => {
                confirmationResolver = resolve;
            });
        }
        
        function closeConfirmationModal(event) {
             const modal = document.getElementById('confirmation-modal');
             // Check if the click target is the modal backdrop, or the OK/Cancel buttons
             if (event.target.id === 'confirmation-modal' || event.target.id === 'confirm-cancel' || event.target.id === 'confirm-ok') {
                
                modal.classList.remove('modal-enter');
                modal.classList.add('modal-leave');
                
                // Resolve the promise if clicking OK, or false if clicking cancel/outside
                if (confirmationResolver) {
                    const result = event.target.id === 'confirm-ok';
                    confirmationResolver(result);
                    confirmationResolver = null; 
                }

                setTimeout(() => {
                    modal.classList.add('hidden');
                    modal.classList.remove('modal-leave');
                }, 300);
            }
        }
        
        async function openDeleteConfirmation(recipeId, recipeName) {
            const confirmed = await showConfirmationModal(
                "Delete Recipe Confirmation",
                `Are you absolutely sure you want to permanently delete "${recipeName}"? This action cannot be undone.`
            );

            if (confirmed) {
                deleteRecipe(recipeId, recipeName);
            }
        }

        // --- Event Listeners and Initialization ---

        document.addEventListener('DOMContentLoaded', () => {
            // Load and render initial state
            loadRecipes();
            renderRecipeList(allRecipes);
            
            // Initial selection: select the first recipe if any exist
            if (allRecipes.length > 0) {
                selectRecipe(allRecipes[0].id, allRecipes[0].name);
            }

            // Event for Add New Recipe button
            document.getElementById('add-recipe-btn').addEventListener('click', () => showModal());

            // Event for search input
            document.getElementById('search-input').addEventListener('input', () => {
                renderRecipeList(allRecipes);
            });
            
            // Attach event listeners for confirmation modal buttons
            document.getElementById('confirm-ok').addEventListener('click', closeConfirmationModal);
            document.getElementById('confirm-cancel').addEventListener('click', closeConfirmationModal);

            // Form submission logic
            document.getElementById('recipe-form').addEventListener('submit', (e) => {
                e.preventDefault();
                
                const recipeId = document.getElementById('recipe-id').value;
                const name = document.getElementById('recipe-name').value.trim();
                const prepTime = parseInt(document.getElementById('prep-time').value);
                const cookTime = parseInt(document.getElementById('cook-time').value);
                const ingredients = document.getElementById('ingredients').value.trim();
                const instructions = document.getElementById('instructions').value.trim();

                const recipeData = { name, prepTime, cookTime, ingredients, instructions };
                
                saveRecipe(recipeData, recipeId);
                hideModal();
            });
        });
    </script>
</body>
</html>
